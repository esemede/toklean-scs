name: contracts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format
        run: forge fmt --check
      - name: Build (sizes)
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
